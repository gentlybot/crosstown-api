# Gently workspace runtime for the Crosstown API.
# Rails API + Sidekiq worker + a Mailpit inbox, with Postgres and Redis as services.
# Routes: the portal repo owns "/", this repo owns /api, /sidekiq, and /mail.

tools:
  - ruby_3_3
  - libpq
  - mailpit
  # Rust toolchain to build the vrp-cli routing solver from crates.io.
  - cargo
  - rustc
  - gcc

env:
  RAILS_ENV: development
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  PORTAL_URL: "{{ gently.GENTLY_ENVIRONMENT_URL }}"
  CORS_ORIGINS: "{{ gently.GENTLY_ENVIRONMENT_URL }}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crosstown
      POSTGRES_PASSWORD: crosstown
      POSTGRES_DB: crosstown_development
    connectionEnv:
      DATABASE_URL: postgres://crosstown:crosstown@postgres:5432/crosstown_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosstown -d crosstown_development"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    connectionEnv:
      REDIS_URL: redis://redis:6379/0

# Runs once per workspace before apps start. Idempotent: db:prepare creates or
# migrates, and db/seeds.rb upserts.
setup:
  - bundle install
  # Routing solver. Slow the first time; cached by the image after that. If it
  # is missing the API falls back to the Ruby savings heuristic.
  - test -x vendor/vrp/bin/vrp-cli || cargo install vrp-cli --root vendor/vrp
  - bin/rails db:prepare
  - bin/rails db:seed

apps:
  api:
    port: 3000
    routes:
      - path: /api
      - path: /sidekiq
    startup:
      - bin/rails server -b 0.0.0.0 -p 3000
    health:
      - endpoint: /api/health

  # Port-less app = long-running background process.
  worker:
    startup:
      - bundle exec sidekiq -C config/sidekiq.yml

  mail:
    port: 8025
    routes:
      - path: /mail
    startup:
      - mailpit --listen 0.0.0.0:8025 --smtp 0.0.0.0:1025 --webroot /mail
    # Mailpit redirects the bare webroot (/mail -> /mail/), and Gently probes
    # without the trailing slash, so use its readiness endpoint.
    health:
      - endpoint: /mail/readyz
